title = "Project Gitleaks configuration"

# Keep the full default gitleaks ruleset at full strength on every authored file.
[extend]
useDefault = true

# ---------------------------------------------------------------------------------------
# WHEN GITLEAKS FLAGS SOMETHING THAT IS ACTUALLY FINE
#
# This repository carries no path allowlist. Every path that once needed one (harness
# test fixtures, worktrees, generated transcripts, dependency directories) is absent, and
# the site has no vendored source: its Python tooling uses only the standard library, and
# its Node dependencies live in node_modules, which is ignored. A path allowlist entry
# for a path that does not exist would only hide a future file placed at that path, so
# none is kept here.
#
# To accept one specific reviewed finding, use a `.gitleaksignore` file at the repository
# root, one fingerprint per line, in the form:
#
#     <commit-sha>:<path>:<rule-id>:<start-line>
#
# Gitleaks prints that fingerprint for every finding, so generate them rather than typing
# them:
#
#     gitleaks detect --redact --report-format json --report-path leaks.json
#     # then take the .Fingerprint of each finding you have reviewed and accepted
#
# That accepts exactly what you looked at and nothing else, so a genuine leak appearing
# later in the same file still fails.
#
# Never accept a finding by loosening or deleting a rule, and never accept one you have
# not actually looked at. If a real credential is found, the fix is to rotate it first
# and remove it second -- an allowlist entry over a live credential hides it from every
# future scan while leaving it exactly as exposed as it was.
#
# CI runs `gitleaks git --log-opts="--all"`, so the whole history is scanned, not only the
# current tree. A finding in an old commit fails CI until it is accepted by fingerprint.
# ---------------------------------------------------------------------------------------
