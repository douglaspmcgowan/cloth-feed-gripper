<text x="429.2" y="267.2" font-size="10" fill="#6b7280" text-anchor="start" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">torsion return spring</text>
<text x="273.4" y="305.2" font-size="10" fill="#1d4ed8" text-anchor="start" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">lever r_t</text>
<text x="300.0" y="594.0" font-size="11" fill="#6b7280" text-anchor="middle" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">no sync gears: an adaptive pinch</text>
<rect x="520" y="300" width="370" height="134" fill="#f9fafb" stroke="#d1d5db"/>
<text x="530.0" y="317.0" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">Numbers (this script)</text>
<text x="530.0" y="335.0" font-size="11" fill="#1f2328" text-anchor="start" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">tendon tension per finger = F r_c / r_t + F_spring = 30.1 N</text>
<text x="530.0" y="351.0" font-size="11" fill="#1f2328" text-anchor="start" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">T_servo = 2 x tension x r_p / eta = 0.708 N*m (local)</text>
<text x="530.0" y="367.0" font-size="11" fill="#1f2328" text-anchor="start" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">lightest servo: A17 (58 g)</text>
<text x="530.0" y="383.0" font-size="11" fill="#1f2328" text-anchor="start" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">proximal servo via Bowden: 1.003 N*m, no listed servo passes</text>
<text x="530.0" y="399.0" font-size="11" fill="#1f2328" text-anchor="start" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">proximal mass-moment 36209 g*mm (83 % budget)</text>
<text x="530.0" y="415.0" font-size="11" fill="#1f2328" text-anchor="start" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">tendon crosses wrist roll (320 deg): wind-up couples roll and grip</text>
<text x="530.0" y="431.0" font-size="11" fill="#1f2328" text-anchor="start" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">creep of the tendon shifts theta_c0: recalibrate (R21)</text>
</svg>