<text x="570.0" y="437.0" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">Numbers (this script)</text>
<text x="570.0" y="455.0" font-size="11" fill="#1f2328" text-anchor="start" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">link l 40 mm; open at psi 36.2 deg (same per-jaw stroke)</text>
<text x="570.0" y="471.0" font-size="11" fill="#1f2328" text-anchor="start" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">T_servo = 2 F l cos(psi) / eta = 0.500 N*m (LC1, psi 0)</text>
<text x="570.0" y="487.0" font-size="11" fill="#1f2328" text-anchor="start" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">lightest servo: A17 (58 g)</text>
<text x="570.0" y="503.0" font-size="11" fill="#1f2328" text-anchor="start" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">tip rises 7.7 mm between closed and open</text>
<text x="570.0" y="519.0" font-size="11" fill="#1f2328" text-anchor="start" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">pads stay parallel (0 deg tilt)</text>
<text x="570.0" y="535.0" font-size="11" fill="#1f2328" text-anchor="start" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">finger moment -&gt; link axial force, not servo torque</text>
<text x="570.0" y="551.0" font-size="11" fill="#1f2328" text-anchor="start" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">fingers hang 18 mm lower than the baseline</text>
<text x="570.0" y="567.0" font-size="11" fill="#1f2328" text-anchor="start" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" paint-order="stroke">mass-moment 41045 g*mm (94 % budget)</text>
