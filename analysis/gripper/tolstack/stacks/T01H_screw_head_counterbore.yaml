  - {name: cbore_position, kind: radial, gdt: {type: position, zone: "=fdm_pos_dia"}, dist: disk, tag: A, source: "counterbore to A|B|C, printed"}
  - {name: horn_thread_position, kind: radial, gdt: {type: position, zone: "=horn_thread_pos_dia"}, dist: disk, tag: A, source: "molded horn pattern"}
