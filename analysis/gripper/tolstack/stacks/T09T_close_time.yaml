id: T09T
title: Close time to first contact after calibration (R19)
parts: ["servo horn", "knuckle A", "knuckle B", "finger A", "finger B"]
constants: basis.yaml
companion_of: T09
units: s (close command to first pad contact)
requirement: "DESIGN-BASIS R19: full close in <= 0.75 s (Douglas ruling 2026-10-12; supersedes 0.5 s). This stack measures time to first pad contact."
spec: {usl: "=close_max"}
accept: {method: mc}
fix: >-
  No timing fix needed for first contact under the ruled 0.75 s limit. Retain the 6 deg slow zone: the 3 deg
  alternative (T09T-slow3) was declined after firmware simulation found excessive contact speed and early-contact force
  (controls.md 6.4).
fix_variant: slow3
notes: >-
  The firmware simulation reaches contact in 503-511 ms with the calibrated contact angle (fw_sim.json). Any
  contact later than the calibrated angle adds (delta theta) / 20 deg/s, because the last part is at the
  near-contact speed. After calibration only the calibration repeatability and the servo repeatability remain.
contributors:
  - {name: t_contact_sim, limits: ["=t_contact_min", "=t_contact_max"], dist: uniform, tag: D, source: "firmware_sim fw_sim.json, k 0.88-1.63"}
  - {name: cal_repeat, nominal: 0, tol: "=cal_rep_deg", sensitivity: "=1/near_speed_dps", dist: normal, tag: A, source: "deg -> s at 20 deg/s"}
  - {name: servo_angle_error, nominal: 0, tol: "=servo_angle_rep_deg", sensitivity: "=1/near_speed_dps", dist: normal, tag: A, source: "deg -> s at 20 deg/s"}
variants:
  - {id: r19p075, role: scenario, label: "Historical R19 limit: 0.5 s (legacy r19p075 scenario id)", spec: {usl: "=close_max_superseded"}}
  - id: slow3
    label: "firmware: JAW_SLOW_ZONE_DEG 6 -> 3 (0.125 s less: 3 deg at 120 instead of 20 deg/s)"
    add:
      - {name: slow_zone_cut, nominal: "=-(slow_zone_deg - 3)*(1/near_speed_dps - 1/fast_speed_dps)", tol: 0, tag: D, source: "3 deg move from the 20 deg/s slow zone to the 120 deg/s command: 3/20 - 3/120 = 0.125 s; confirm in firmware_sim"}
