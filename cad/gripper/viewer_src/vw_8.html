
<script>
"use strict";
/* ---------- 06 finger FEA ---------- */
const TURBO=["#30123b","#4662d7","#36aaf9","#1ae4b6","#72fe5e","#c8ef34","#faba39","#f66b19","#ca2a04","#7a0403"].map(c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]);
function cmap(t){t=Math.max(0,Math.min(1,t))*(TURBO.length-1);const i=Math.min(TURBO.length-2,Math.floor(t)),f=t-i,a=TURBO[i],b=TURBO[i+1];
  return `rgb(${Math.round(a[0]+(b[0]-a[0])*f)},${Math.round(a[1]+(b[1]-a[1])*f)},${Math.round(a[2]+(b[2]-a[2])*f)})`;}
function cssv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()||"#888";}
function drawFEA(){
  const key=$("#feaCase").value,C=D.fea[key],M=D.fea[C.mesh],E=+$("#feaE").value;let F=+$("#feaF").value;
  const nl=!C.linear;$("#feaF").disabled=nl;
  let dsc,ssc,Fshow;
  if(nl){dsc=1;ssc=E/67;Fshow=C.F*E/67;}else{dsc=F*67/E;ssc=F;Fshow=F;}
  const field=$("#feaField").value==="gl"&&C.gl?"gl":"vm";const vals=field==="gl"?C.gl:C.vm,sf=field==="gl"?1:ssc;
  const nx=M.nodes,u=C.u,n=nx.length/2,el=M.el;
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(let i=0;i<n;i++){const a=nx[2*i],b=nx[2*i+1],c=a+u[2*i]*dsc,d=b+u[2*i+1]*dsc;x0=Math.min(x0,a,c);x1=Math.max(x1,a,c);y0=Math.min(y0,b,d);y1=Math.max(y1,b,d);}
  const cv=$("#feaCanvas"),ctx=cv.getContext("2d"),W=cv.width,H=cv.height,pad=36;
  const k=Math.min((W-2*pad)/(x1-x0),(H-2*pad)/(y1-y0)),ox=(W-(x1-x0)*k)/2,oy=(H-(y1-y0)*k)/2;
  const X=v=>ox+(v-x0)*k,Y=v=>H-oy-(v-y0)*k;
  ctx.clearRect(0,0,W,H);ctx.fillStyle=cssv("--surface");ctx.fillRect(0,0,W,H);
  ctx.fillStyle=cssv("--line");ctx.beginPath();
  for(let t=0;t<el.length;t+=3){const a=el[t],b=el[t+1],c=el[t+2];ctx.moveTo(X(nx[2*a]),Y(nx[2*a+1]));ctx.lineTo(X(nx[2*b]),Y(nx[2*b+1]));ctx.lineTo(X(nx[2*c]),Y(nx[2*c+1]));ctx.closePath();}
  ctx.globalAlpha=0.45;ctx.fill();ctx.globalAlpha=1;
  const sorted=Float32Array.from(vals).sort(),hi=sorted[Math.floor(sorted.length*0.995)]*sf||1,mx=sorted[sorted.length-1]*sf;
  for(let t=0;t<el.length;t+=3){const a=el[t],b=el[t+1],c=el[t+2];const val=(vals[a]+vals[b]+vals[c])/3*sf;
    ctx.fillStyle=cmap(val/hi);ctx.strokeStyle=ctx.fillStyle;ctx.lineWidth=0.6;ctx.beginPath();
    ctx.moveTo(X(nx[2*a]+u[2*a]*dsc),Y(nx[2*a+1]+u[2*a+1]*dsc));ctx.lineTo(X(nx[2*b]+u[2*b]*dsc),Y(nx[2*b+1]+u[2*b+1]*dsc));ctx.lineTo(X(nx[2*c]+u[2*c]*dsc),Y(nx[2*c+1]+u[2*c+1]*dsc));ctx.closePath();ctx.fill();ctx.stroke();}
  let umax=0;for(let i=0;i<n;i++)umax=Math.max(umax,Math.hypot(u[2*i],u[2*i+1])*dsc);
  ctx.fillStyle=cssv("--ink2");ctx.font="600 20px "+cssv("--sans");ctx.fillText("root, fixed",pad,pad-8);
  const unit=field==="gl"?"":" MPa";
  $("#cbLo").textContent="0";$("#cbHi").textContent=(field==="gl"?fmt(hi,3):fmt(hi,2))+unit;
  kv($("#feaNums"),[["Force",fmt(Fshow,2)+" N",`at ${E} MPa`],["Largest deflection",fmt(umax,2)+" mm"],[field==="gl"?"Peak strain":"Peak stress",field==="gl"?fmt(mx,3):fmt(mx,2)+" MPa"],
    ["Solution",nl?"nonlinear":"linear",nl?"last converged state":"scaled from 1 N"],["Mesh",fmt(el.length/3,0)+" triangles",fmt(n,0)+" nodes"]]);
  $("#feaFv").textContent=fmt(Fshow,1)+" N";
}
function renderFEA(){
  ["feaCase","feaF","feaE","feaField"].forEach(id=>$("#"+id).addEventListener("input",drawFEA));drawFEA();
  fitDraw($("#kWin"),cw=>{const P=plot($("#kWin"),{w:cw,h:150,m:{l:16,r:16,t:14,b:42},x:{min:0.6,max:1.9,label:"Tip stiffness (N/mm)"},y:{min:0,max:3,ticks:[]}});
    P.vband(0.88,1.63,"var(--band)");P.vline(0.88,"var(--ok)","4 3","0.88");P.vline(1.63,"var(--ok)","4 3","1.63");
    s("rect",{x:P.x(1.07),y:P.y(1.35),width:P.x(1.29)-P.x(1.07),height:P.y(0.65)-P.y(1.35)},P.svg,"fill:var(--c2);opacity:.45");
    P.dot(1.101,2.1,"var(--c1)",6,"in plane, 67 MPa");P.dot(0.922,1.0,"var(--c4)",6,"across layers, 56 MPa");
    keyRow($("#kWin"),[["In plane, 67 MPa: 1.101 N/mm","var(--c1)"],["Across layers, 56 MPa: 0.922 N/mm","var(--c4)"],["With nail and sensor parts: 1.07 to 1.29 N/mm","var(--c2)",null,8],["Allowed window: 0.88 to 1.63 N/mm","var(--ok)","4 3"]]);});
  const cols=D.sweep.cols,ci=n=>cols.indexOf(n),R=D.sweep.rows,rec=D.sweep.rec;
  const ks=R.map(r=>r[ci("k_tip_E67")]).filter(Number.isFinite),ms=R.map(r=>r[ci("mass_g")]).filter(Number.isFinite);
  const Ps=plot($("#sweepChart"),{w:640,h:360,x:{min:Math.floor(Math.min(...ms)),max:Math.ceil(Math.max(...ms)),label:"Finger mass (g)"},y:{min:0,max:Math.ceil(Math.max(...ks)*2)/2,label:"Tip stiffness at 67 MPa (N/mm)"}});
  Ps.hband(0.88,1.63,"var(--band)");
  R.forEach(r=>{const f=r[ci("feasible")],w=r[ci("window_ok")],fl=r[ci("feasible_linear")];const c=f?"var(--ok)":fl?"var(--c1)":w?"var(--warn)":"var(--c5)";
    const dd=Ps.dot(r[ci("mass_g")],r[ci("k_tip_E67")],c,f?4.5:3,`${r[ci("ribs")]} ribs @ ${r[ci("rib_angle")]}°, wall ${r[ci("wall")]}, rib ${r[ci("rib_thickness")]}, tip ${r[ci("tip_width")]} → k ${fmt(r[ci("k_tip_E67")],3)}, ${fmt(r[ci("mass_g")],2)} g`);if(!w&&!f)dd.style.opacity="0.3";});
  if(rec){const rk=rec.k_tip_E67||rec.k_tip,rx=Ps.x(rec.mass_g),ry=Ps.y(rk);Ps.dot(rec.mass_g,rk,"none",9,"recommended","var(--ink)");
    s("line",{x1:rx+6,y1:ry+7,x2:rx+22,y2:ry+44},Ps.svg,"stroke:var(--ink);stroke-width:1.2");
    const t=s("text",{x:rx+16,y:ry+58,"text-anchor":"start"},Ps.svg,"fill:var(--ink);font-weight:600");t.textContent="Recommended";}
  Ps.legend([["passes every check","var(--ok)"],["passes the linear checks","var(--c1)"],["in the window only","var(--warn)"],["outside the window","var(--c5)"]],{x:Ps.m.l+Ps.pw-170,y:Ps.m.t+16});
  const sc=D.sweep.counts;
  kv($("#sweepNums"),[["Geometries run",fmt(sc.runs,0)],["Inside the stiffness window",fmt(sc.window_ok,0)],["Also pass stress and strain",fmt(sc.feasible_linear,0)],["Checked with the nonlinear model",fmt(sc.nl_screened,0)],["Hold 8 N without folding",fmt(sc.nl_trip_ok,0)],["Hold 10 N without folding",fmt(sc.nl_cap_ok,0)]]);
}
RENDER.finger=renderFEA;

/* ---------- 07 gears ---------- */
const ALLOW={PLA:[15,23.3,35],PETG:[20.4,34,51],"PA6-CF":[38,68,102],POM:[21.3,46,69],Al6061:[64.7,184,276],Brass:[null,null,null]};
function renderGears(){
  const G=D.gears,R=G.rec;
  const lc=G.lc||{};kv($("#gearLoads"),[["Hold",fmt(lc.LC1,3)+" "+NM],["At the 10 N cap",fmt(lc.LC2,3)+" "+NM],["Full servo stall",fmt(lc.LC3,3)+" "+NM],["Shock",fmt(lc.shock,3)+" "+NM]]);
  const mats=Object.keys(G.bmin);const sel=$("#gearMat");sel.innerHTML=mats.map(m=>`<option${m==="PA6-CF"?" selected":""}>${esc(m)}</option>`).join("");
  const rd=$("#gearMapRead");let pickd=null;
  const say=(mat,m,z,v)=>{rd.textContent=v==null?`${mat}, module ${m} mm, ${z} teeth: no face width up to 10 mm passes every check.`:`${mat}, module ${m} mm, ${z} teeth: the narrowest face width that passes every check is ${v} mm.`;};
  function map(cw){const mat=sel.value,B=G.bmin[mat],mods=G.modules,tee=G.teeth;
    cw=cw||Math.min(820,Math.round($("#gearMap").clientWidth))||640;
    const W=Math.min(cw,960),H=Math.max(230,mods.length*44+60),l=106,t=10,cw2=(W-l-8)/tee.length,ch=(H-t-48)/mods.length;
    const svg=s("svg",{viewBox:`0 0 ${W} ${H}`});
    const pk=(mat==="PA6-CF")?[1.5,19]:null;if(!pickd||pickd.mat!==mat)pickd=null;
    mods.forEach((m,i)=>{const row=mods.length-1-i;const tt=s("text",{x:l-8,y:t+row*ch+ch/2+4.5,"text-anchor":"end"},svg);tt.textContent="Module "+m+" mm";
      tee.forEach((z,j)=>{const v=B[i]&&B[i][j];const x=l+j*cw2,y=t+row*ch;
        const r=s("rect",{x:x+1,y:y+1,width:cw2-2,height:ch-2,rx:3,tabindex:"0",role:"button","aria-label":`Module ${m} mm, ${z} teeth, ${v==null?"nothing passes":"narrowest face "+v+" mm"}`},svg,v==null?"fill:var(--raised)":`fill:var(--c1);opacity:${0.25+0.75*(1-(v-4)/6)}`);
        const pick=()=>{pickd={mat,m,z};say(mat,m,z,v);$$("#gearMap rect.sel").forEach(e=>e.classList.remove("sel"));r.classList.add("sel");};
        r.addEventListener("click",pick);r.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pick();}});
        if(v!=null){const tx=s("text",{x:x+cw2/2,y:y+ch/2+4.5,"text-anchor":"middle",class:"val","pointer-events":"none"},svg,"fill:var(--ink);font-weight:600");tx.textContent=v;}
        if(pk&&m===pk[0]&&z===pk[1]){s("rect",{x:x-1,y:y-1,width:cw2+2,height:ch+2,rx:4,"pointer-events":"none"},svg,"fill:none;stroke:var(--c2);stroke-width:3");if(!pickd)say(mat,m,z,v);}
        if(pickd&&pickd.m===m&&pickd.z===z){say(mat,m,z,v);r.classList.add("sel");}});});
    tee.forEach((z,j)=>{const tt=s("text",{x:l+j*cw2+cw2/2,y:H-26,"text-anchor":"middle"},svg);tt.textContent=z;});
    const xl=s("text",{x:l+(W-l)/2,y:H-6,"text-anchor":"middle",class:"lbl"},svg);xl.textContent="Teeth per gear";svg.setAttribute("role","img");svg.setAttribute("aria-label","Narrowest passing face width by module and tooth count");
    if(!pk&&!pickd)rd.textContent="Select a cell to read what its number means.";
    $("#gearMap").innerHTML="";$("#gearMap").appendChild(svg);}
  fitDraw($("#gearMap"),map);sel.addEventListener("change",()=>{pickd=null;map();});
  /* profile */
  const vb=D.gprof.viewBox,svg=s("svg",{viewBox:`${vb[0]-1} ${vb[1]-1} ${vb[2]+2} ${vb[3]+2}`,role:"img","aria-label":"Tooth profile of the two gear sectors"},null,"overflow:hidden");
  const g=s("g",{transform:"scale(1,-1)"},svg);
  [[-14.25,"var(--c1)"],[14.25,"var(--c2)"]].forEach(([cx,c])=>s("circle",{cx,cy:0,r:14.25},g,`fill:none;stroke:${c};stroke-width:0.05;stroke-dasharray:0.5 0.3;opacity:.7`));
  [["GEAR_A","var(--c1)"],["GEAR_B","var(--c2)"]].forEach(([id,c])=>{const p=D.gprof[id].pts;s("path",{d:"M"+p.map(q=>q[0]+","+q[1]).join("L")+"Z"},g,`fill:${c};fill-opacity:.14;stroke:${c};stroke-width:0.07;stroke-linejoin:round`);});
  s("line",{x1:vb[0],x2:vb[0]+vb[2],y1:0,y2:0},g,"stroke:var(--ink2);stroke-width:0.03;stroke-dasharray:0.3 0.3");
  const lab=(x,y,txt,c)=>{const t=s("text",{x,y},svg,`fill:${c};font-size:1.05px;font-weight:600`);t.textContent=txt;};
  lab(vb[0]+0.3,vb[1]+1.4,"Sector A","var(--c1)");lab(vb[0]+0.3,vb[1]+2.8,"Sector B","var(--c2)");
  $("#gearProf").appendChild(svg);
  $("#gearProfCap").textContent=`Module ${R.printed.m} mm, ${R.printed.z} teeth, ${R.printed.alpha}° pressure angle, in mm. Pitch circles of radius 14.25 are dashed; the pivots sit 28.5 mm apart.`;
  /* per-material */
  const pp=G.per_pair;
  $("#gearMatTable").innerHTML=`<thead><tr><th>Material</th><th class="n">Allowable stress at hold, cap, stall (MPa)</th><th class="n">Geometries tried</th><th class="n">Pass every check</th><th class="n">Pass with 1.5&times; margin</th><th class="n">Best worst-case safety factor</th><th>Verdict</th></tr></thead><tbody>`+
    Object.keys(pp).map(k=>{const a=ALLOW[k]||[];const p=pp[k];return `<tr${k==="PA6-CF"?' class="hl"':""}><td><b>${esc(k)}</b></td><td class="n">${a[0]==null?"–":a.join(", ")}</td><td class="n">${fmt(p.n_eval,0)}</td><td class="n ${p.n_pass?"cell-ok":"cell-bad"}">${fmt(p.n_pass,0)}</td><td class="n">${fmt(p.n_pass_margin,0)}</td><td class="n">${fmt(p.best_margin_any,3)}</td><td>${p.n_pass_margin?st("pass","viable"):p.n_pass?st("risk","thin"):st("fail","none pass")}</td></tr>`;}).join("")+
    `</tbody>`;
  const opts=[["printed","Printed pick"],["printed_robust","Printed, robust"],["cnc","Machined"]].filter(([k])=>R[k]);
  const row=(l,f)=>`<tr><td>${l}</td>${opts.map(([k],i)=>`<td class="n${i===0?" pick":""}">${f(R[k],k)}</td>`).join("")}</tr>`;
  const extra={printed:["6.2e7","$0.05 to 0.20 of filament, assumed","same day","hardened nozzle, dried filament, anneal"],printed_robust:["–","as the pick","same day","as the pick"],cnc:["4.8e6","$60 to 200 per quote, assumed","5 to 15 business days","pivots move to 31.5 mm apart"]};
  $("#gearCmp").innerHTML=`<thead><tr><th></th>${opts.map(([k,t])=>`<th class="n">${t}</th>`).join("")}</tr></thead><tbody>`+
    row("Material",r=>esc(r.pair))+row("Module, teeth, face width",r=>`${r.m} mm, ${r.z}, ${r.b} mm`)+row("Pressure angle, profile shift",r=>`${r.alpha}°, ${r.x}`)+row("Centre distance",r=>fmt(r.a_w,2)+" mm")+
    row("Root safety factor: hold, cap, stall",r=>`${fmt(r.SF.F_LC1,2)}, ${fmt(r.SF.F_LC2,2)}, ${fmt(r.SF.F_LC3,2)}`)+row("Root safety factor in shock",r=>fmt(r.SF.F_shock,2))+row("Flank safety factor: hold, stall",r=>`${fmt(r.SF.H_LC1,2)}, ${fmt(r.SF.H_LC3,2)}`)+
    row("Root stress: hold, stall",r=>`${fmt(r.sigmaF_MPa.LC1,1)}, ${fmt(r.sigmaF_MPa.LC3,1)} MPa`)+row("Life at the hold load",r=>fmtE(r.N_f_LC1)+" cycles")+row("Weakest-link life from the dyno",(r,k)=>extra[k][0]==="–"?"–":extra[k][0]+" grips")+
    row("Worst wear, 0.15 mm limit",r=>fmt(r.wear_mm.greased_worst,3)+" mm")+row("Contact ratio",r=>fmt(r.eps,3))+row("Backlash",r=>`${fmt(r.backlash.jt_design_mm,2)} mm, ${fmt(r.backlash.deg,2)}°`)+row("Pair mass",r=>fmt(r.mass_pair_g,2)+" g")+
    row("Cost",(r,k)=>extra[k][1])+row("Lead time",(r,k)=>extra[k][2])+row("Needs",(r,k)=>extra[k][3])+"</tbody>";
}
RENDER.gears=renderGears;
</script>
