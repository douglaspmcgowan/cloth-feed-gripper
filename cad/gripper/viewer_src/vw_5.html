/* drawing sheets: zoom by button, pinch, key or ctrl-wheel; pan by scroll or drag */
function setZoom(sh,z,cx,cy){z=Math.max(1,Math.min(6,z));const z0=+sh.dataset.zoom||1;if(z===z0)return;
  if(cx===undefined){cx=sh.clientWidth/2;cy=sh.clientHeight/2;}
  const fx=(sh.scrollLeft+cx)/sh.scrollWidth,fy=(sh.scrollTop+cy)/sh.scrollHeight;
  if(z0===1)sh.style.setProperty("--zh",sh.clientHeight+"px");
  sh.dataset.zoom=z;sh.classList.toggle("zoomed",z>1);sh.style.setProperty("--zw",(z*100)+"%");
  sh.scrollLeft=fx*sh.scrollWidth-cx;sh.scrollTop=fy*sh.scrollHeight-cy;
  const c=sh.nextElementSibling;$(".zlevel",c).textContent=Math.round(z*100)+" %";$('[data-z="out"]',c).disabled=z<=1;$('[data-z="fit"]',c).disabled=z<=1;$('[data-z="in"]',c).disabled=z>=6;}
function sheetGestures(sh){let d0=0,z0=1,drag=null;
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  sh.addEventListener("touchstart",e=>{if(e.touches.length===2){d0=dist(e.touches);z0=+sh.dataset.zoom||1;}},{passive:true});
  sh.addEventListener("touchmove",e=>{if(e.touches.length!==2||!d0)return;e.preventDefault();const r=sh.getBoundingClientRect();
    setZoom(sh,z0*dist(e.touches)/d0,(e.touches[0].clientX+e.touches[1].clientX)/2-r.left,(e.touches[0].clientY+e.touches[1].clientY)/2-r.top);},{passive:false});
  sh.addEventListener("touchend",e=>{if(e.touches.length<2)d0=0;});
  sh.addEventListener("wheel",e=>{if(!e.ctrlKey)return;e.preventDefault();const r=sh.getBoundingClientRect();setZoom(sh,(+sh.dataset.zoom||1)*(e.deltaY<0?1.2:1/1.2),e.clientX-r.left,e.clientY-r.top);},{passive:false});
  sh.addEventListener("keydown",e=>{const z=+sh.dataset.zoom||1;if(e.key==="+"||e.key==="=")setZoom(sh,z*1.5);else if(e.key==="-")setZoom(sh,z/1.5);else if(e.key==="0")setZoom(sh,1);});
  sh.addEventListener("pointerdown",e=>{if(e.pointerType!=="mouse"||!sh.classList.contains("zoomed"))return;drag=[e.clientX,e.clientY,sh.scrollLeft,sh.scrollTop];sh.setPointerCapture(e.pointerId);e.preventDefault();sh.focus();});
  sh.addEventListener("pointermove",e=>{if(!drag)return;sh.scrollLeft=drag[2]-(e.clientX-drag[0]);sh.scrollTop=drag[3]-(e.clientY-drag[1]);});
  const end=()=>{drag=null;};sh.addEventListener("pointerup",end);sh.addEventListener("pointercancel",end);}
/* one cue under anything that scrolls sideways */
function cardify(){$$("table.cards").forEach(t=>{const hd=$$("thead th",t).map(th=>th.textContent.trim());$$("tbody tr, tfoot tr",t).forEach(tr=>[...tr.cells].forEach((c,i)=>{if(hd[i]&&!c.dataset.l)c.dataset.l=hd[i];}));});}
function cues(){cardify();$$(".view:not([hidden]) .tw, .view:not([hidden]) .chart.wide").forEach(el=>{if(!el.offsetParent)return;const sx=el.scrollWidth>el.clientWidth+2,sy=el.scrollHeight>el.clientHeight+2,on=sx||sy,n=$$("tbody tr",el).length;
  const txt=sx&&sy?`Scroll the table sideways and down for all ${n} rows, or open full screen`:sy?`Scroll the table for all ${n} rows, or open full screen`:"Scroll sideways, or open full screen";
  let c=el.nextElementSibling;if(c&&c.classList.contains("scrollcue")){c.hidden=!on;c.textContent=txt;}else if(on)el.after(h("p",{class:"note scrollcue"},null,txt));});}
function cueSoon(){setTimeout(cues,0);}
function setMenu(on){$("#rail").classList.toggle("open",on);$("#menuBtn").setAttribute("aria-expanded",String(on));}
function setFull(fig,on){$$(".fig.is-full").forEach(f=>{f.classList.remove("is-full");$(".fullb",f).textContent="Full screen";});$$(".sheet",fig).forEach(sh=>setZoom(sh,1));
  document.documentElement.classList.toggle("noscroll",on);if(on){fig.classList.add("is-full");fig.scrollTop=0;}
  const b=$(".fullb",fig);b.textContent=on?"Exit full screen":"Full screen";b.focus();if(typeof V3!=="undefined"&&V3)V3.dirty=true;window.dispatchEvent(new Event("resize"));}
function setHash(id){try{history.replaceState(null,"","#"+id);}catch(e){}}
function selectFig(fig,user){const v=fig.closest(".view");
  $$(":scope > .fig",v).forEach(f=>{const on=f===fig;if(!on&&f.classList.contains("is-full"))setFull(f,false);f.hidden=!on;const t=document.getElementById("tab-"+f.id);if(t){t.setAttribute("aria-selected",String(on));t.tabIndex=on?0:-1;}});
  if(v.id==="finger"&&DONE.finger)drawFEA();cueSoon();if(user){setHash(fig.id);store("gripperFig-"+v.id,fig.id);}}
function openDetail(d,on,user){d.hidden=!on;const b=$(`.depth button[aria-controls="${d.id}"]`);if(b)b.setAttribute("aria-expanded",String(on));cueSoon();

function showView(id){

  if(!DONE[id]){DONE[id]=true;$$("img[data-img]",v).forEach(im=>{im.src=D.img[im.dataset.img]||"";});
    $$("[data-notes]",v).forEach(u=>{u.innerHTML=((D.sheet_notes||{})[u.dataset.notes]||[]).map(n=>`<li>${esc(n)}</li>`).join("");});
    try{RENDER[id]&&RENDER[id]();}catch(err){console.error("render "+id,err);h("p",{class:"err"},$(".vh",v),"This view could not be drawn ("+esc(err.message)+"). Rebuild the page with viewer_build.py.");}}

function go(raw,scroll){
  /* a fit-check deep link carries its pose and camera after a "~"; the element id is what comes before it */
  let id=String(raw||"").replace(/^#/,"").split("~")[0];id=ALIAS[id]||id;

  const pk=!view&&PKEY(id);if(pk){showView("parts");if(typeof openPartRow==="function")openPartRow(pk,true);if(scroll)window.scrollTo(0,0);return;}
  if(!view){view=$("#model");el=view;}
  const first=CUR!==view.id;showView(view.id);
  let fig=el.closest(".fig");
  if(!fig&&el===view&&first){const r=store("gripperFig-"+view.id),rf=r&&document.getElementById(r);if(rf&&rf.closest(".view")===view)selectFig(rf,false);}
  if(fig)selectFig(fig,false);
