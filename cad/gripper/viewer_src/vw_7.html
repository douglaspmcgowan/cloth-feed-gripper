
<script>

function pics(el,list){el.innerHTML=list.map(([k,cap,notes])=>`<figure class="pic"><img src="${D.img[k]}" alt="${esc(cap)}"><figcaption class="cap"><b>${esc(cap)}</b>${(notes||[]).map(n=>`<span>${esc(n)}</span>`).join("")}</figcaption></figure>`).join("");

function renderMass(){

  kv($("#massNums"),[["Mass with cloth",fmt(MASS.total_g_incl_cloth,1)+" g",`limit about ${fmt(LIMIT_G,0)} g`],["Centre of mass",fmt(MASS.com_u_past_H,1)+" mm","past the wrist horn"],
    ["Mass-moment",fmt(MASS.mass_moment_gmm,0)+" "+GMM,`${fmt(MASS.budget_use*100,0)} % of ${fmt(MASS.budget_gmm,0)}`,MASS.ok?"cell-ok":"cell-bad"]]);

  const grp=[["Housing and plates",["housing"],["housing","front_plate","wrist_mount"]],["Knuckles",["knuckles"],["knuckle_a","knuckle_b"]],["Fingers and nail",["fingers TPU"],["finger_a","finger_b","nail_a"]],
    ["Servo",["actuator"],["servo"]],["Horn, pins, fasteners",["horn, pins, fasteners"],["horn","fasteners","fasteners_a","fasteners_b"]],["Sensor parts and wiring",["FSR + wiring"],["fsr_backing_b","fsr_sensor_b","fsr_puck_b","@FSR + servo wiring"]],["Cloth at the pad",["cloth at pad"],["@cloth at the pad"]]];

  let tDB=0,tC=0;

  ["th","Pad angle (°)",0,10,0.5,0],["rc","Moment arm (mm)",40,90,1,65],["xf","Pad position (mm)",8,16,0.25,11.5],["eta","Efficiency (0 to 1)",0.6,0.95,0.01,0.85],["hf","Hold fraction of stall (0 to 1)",0.25,0.5,0.01,0.4]];
const SV={};
function Freq(mua,mub,T,SF,th){const t=th*Math.PI/180,den=(mua+mub)*Math.cos(t)-2*Math.sin(t);return den<=0?Infinity:SF*T/den;}

function drawTornado(cw){

    s("text",{x:x1+5,y:ty},Pt.svg,"fill:var(--ink);font-weight:600;paint-order:stroke;stroke:var(--surface);stroke-width:4px").textContent=fmt(hi,2);
    if(lo<tr.base)s("text",{x:x0-5,y:ty,"text-anchor":"end"},Pt.svg,"fill:var(--ink);font-weight:600").textContent=fmt(lo,2);});
  Pt.vline(tr.base,"var(--ink2)","3 3");Pt.vline(lim,"var(--bad)","5 3");
  s("text",{x:Pt.x(tr.base)-5,y:Pt.m.t-10,"text-anchor":"end"},Pt.svg).textContent="Design point "+fmt(tr.base,2);
  s("text",{x:Pt.x(lim)+5,y:Pt.m.t-10},Pt.svg,"fill:var(--bad);font-weight:600").textContent="Servo limit "+fmt(lim,2);
}
function renderTorque(){

    {k:"tmesh",t:"Mesh torque at stall ("+NM+")",n:1,f:r=>fmt(r.tmesh,2)},{k:"stock",t:"Stock",f:r=>r.stock===1?st("pass","in"):r.stock===0.5?st("risk","listed"):r.stock===0?st("fail","out"):"–"},

    [`${BUILD.model}, the build servo`,[["Hold margin",fmt(mB,3),`hold fraction ${fmt(v.hf,2)}`,bad(mB)],["Close time",fmt(tc,3)+" s",`limit ${R19_CLOSE_S} s`,tc>R19_CLOSE_S?"cell-bad":"cell-ok"]]],

    ["DS3235, the alternative",[["Hold margin",fmt(mA19,3),"design 1.622",bad(mA19)]]]];
  if(!$("#sensOut h3")){$("#sensOut").innerHTML=G.map((g,i)=>`<h3>${g[0]}</h3><dl class="kv" data-g="${i}"></dl>`).join("");}

  const R=D.grip.T_hold_vs_rc,Pr=plot($("#rcChart"),{w:640,h:340,x:{min:40,max:90,label:"Moment arm (mm)"},y:{min:2,max:16,label:"Hold torque ("+KGCMU+")"}});

  Pr.hline(BUILD_STALL*HOLD_FRAC,"var(--bad)","5 3","servo limit, "+fmt(BUILD_STALL*HOLD_FRAC,2)+" "+KGCMU,"start");
