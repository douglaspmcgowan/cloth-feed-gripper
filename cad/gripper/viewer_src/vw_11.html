<script>
"use strict";
/* ---------- fit check: one finding at a time, flown to, cut through its two closest points and dimensioned ----------
   Every number comes from fit3d.json (gaps, sections, overlap solids, nearness, tolerances, insertion sweeps) and the
   files it cites; nothing here is typed by hand. */
const F3=D.fit3d||{th:[0],pairs:[],static:[],roll:[]};
const DET=F3.detail||{},OVL=F3.overlaps||[],BLD=F3.builds||[];
const STATICP=new Set(["housing","front_plate","wrist_mount","servo","fasteners"]);
const FITREQ=D.fitreq||{requirements:{},sampling:{allowance_mm:{}}},DISPLAY_TIGHT=F3.tight_mm||0.5,NEAR_T=F3.near_threshold_mm||1;
/* contacts the design means to have: the bushes run on the pivot pins, the gears mesh, and the pads meet in the grip */
const DESIGNED=[["fasteners_a","fasteners","bush on pivot pin A"],["fasteners_b","fasteners","bush on pivot pin B"],["horn","servo","horn on the servo spline"],
  ["knuckle_a","fasteners","knuckle A running on its shims"],["knuckle_b","fasteners","knuckle B running on its shims"]];
const FLOOR=-7.4; /* the firmware never drives the jaw below this angle */
const designedWhy=p=>p.kind==="pad"?"pads meet in the grip below 0°":p.kind==="gear"?"gear teeth in mesh":(DESIGNED.find(d=>d[0]===p.a&&d[1]===p.b)||[])[2]||"";
const pn=k=>(PLABEL[k]||k).replace(/ with gear sector/,"");
/* a part name inside a sentence: lower the first word only, so "Knuckle B" reads "knuckle B", not "knuckle b" */
const lc=s=>String(s).replace(/^\S+/,w=>w.toLowerCase());
const thIdx=th=>{let b=0;F3.th.forEach((t,i)=>{if(Math.abs(t-th)<Math.abs(F3.th[b]-th))b=i;});return b;};
const gapTxt=d=>d==null?"more than 6 mm":fmt(d,2)+" mm";
/* a tolerance stack is named by what it checks, never by its file id */
const stackName=s=>s&&s.title?lc(String(s.title).split(/[,(]/)[0].trim()):"tolerance";
/* notes quoted from the tolerance files: comparisons, source tags and stack ids are put in words */
const codeWords=s=>String(s||"").replace(/\s*>=\s*/g," at least ").replace(/\s*<=\s*/g," at most ").replace(/\s*\[[A-Z]\]/g,"").replace(/\bstack T\d+[A-Z]?(-[\w-]+)?\b/g,"stack")
  .replace(/\bT\d+[A-Z]?(-[\w-]+)?\b/g,id=>{const r=(D.tol||[]).find(x=>x.id===id);return r?`the ${stackName({title:r.t})} stack,`:"another stack,";}).replace(/\s+/g," ").trim();
/* angles: whole degrees as integers, a non-integer pose such as the -7.4° floor to one decimal */
const deg=v=>fmt(v,Number.isInteger(Math.round(v*1e6)/1e6)?0:1);
/* a requirement id (B4) stays; a tolerance stack id (T07) is named by what it checks */
const checkId=id=>{if(!/^T\d/.test(id))return id;const r=(D.tol||[]).find(x=>x.id===id);return (r?stackName({title:r.t}).replace(/ jt$/,""):"tolerance")+" check";};
function requirementFor(p){return FITREQ.requirements[p.a+"|"+p.b]||null;}
function requirementStatus(p){if(p.status==="governed elsewhere"){
  const checks=p.governing_checks||[];
  if(!checks.length||checks.some(c=>c.status!=="met"&&c.status!=="at risk"))return "fail";
  return checks.some(c=>c.status==="at risk")?"risk":"pass";}
  return ({"fail":"fail","at risk":"risk","met":"pass","no requirement":"none"})[p.status]||"fail";}
function pairStatus(p){return requirementStatus(p);}
/* worst gap at or above the firmware floor */
function inRange(p){let w=null;F3.th.forEach((t,i)=>{if(t<FLOOR-1e-6||p.d[i]==null)return;if(!w||p.d[i]<w.d)w={d:p.d[i],th:t,v:p.v[i]};});return w;}
const FCK=[
  {id:"body",name:"Moving parts to the body",pairs:F3.pairs.filter(p=>!p.kind&&STATICP.has(p.b)&&!designedWhy(p))},
  {id:"cross",name:"Side A to side B",pairs:F3.pairs.filter(p=>!p.kind&&!STATICP.has(p.b))},
  {id:"gear",name:"Gear mesh",pairs:F3.pairs.filter(p=>p.kind==="gear")},
  {id:"pads",name:"Pads",pairs:F3.pairs.filter(p=>p.kind==="pad")},
  {id:"design",name:"Running fits",pairs:F3.pairs.filter(p=>!p.kind&&designedWhy(p))},
  {id:"roll",name:"Roll gap to the wrist link"},
  {id:"keep",name:"Keep-out bands near the horn"},
  {id:"env",name:"Stock gripper envelope"},
  {id:"press",name:"Overlaps in the body"},
];
function worstPair(list){let w=null;list.forEach(p=>{if(p.dmin==null)return;if(!w||p.dmin<w.dmin||(p.dmin===w.dmin&&p.vmax>w.vmax))w=p;});return w;}
function rollRows(psi,th){const R=F3.roll||[];return (R.find(r=>r.psi===psi&&r.theta===th)||R.find(r=>r.psi===psi)||{rows:[]}).rows;}
function rollWorst(){let w=null;(F3.roll||[]).forEach(r=>r.rows.forEach(x=>{if(!w||x.d<w.d)w=Object.assign({psi:r.psi,theta:r.theta},x);}));return w;}
const RW=rollWorst();
const RING=FIT.roll_ring_clearance.filter(r=>r.radial_gap!==null);
function checkSummary(c){
  if(c.pairs){const w=worstPair(c.pairs);if(!w)return {txt:"nothing within 6 mm",st:"pass"};
    if(c.id==="pads"){const vm=Math.max(...c.pairs.map(p=>p.vmax||0));return {txt:`${fmt(vm,0)} mm³ overlap at ${deg(F3.th[0])}°, by design`,st:"pass",w};}
    if(c.id==="gear"||c.id==="design")return {txt:`${gapTxt(w.dmin)}, ${pn(w.a)} to ${pn(w.b)}`,st:"none",w};
    const st=pairStatus(w,w.dmin,w.vmax,w.thmin),dd=(w.d||[]).filter(x=>x!=null),cst=dd.length>1&&Math.max(...dd)-Math.min(...dd)<0.01;
    return {txt:`${w.vmax>0.001?fmt(w.vmax,2)+" mm³ overlap":gapTxt(w.dmin)} ${cst?"at every jaw angle":`at ${deg(w.thmin)}°`}, ${pn(w.a)} to ${pn(w.b)}`,st,w};}
  if(c.id==="roll"){const rg=FIT.roll_min_radial_gap_mm;return {txt:RW?`${fmt(RW.d,2)} mm in 3D at every roll angle; ${fmt(rg,2)} mm by the ring method`:`${fmt(rg,2)} mm by the ring method`,st:(RW?RW.d:rg)<1?"risk":"pass"};}
  if(c.id==="keep"){const ko=FIT.keepout_params;return {txt:ko.map(k=>`radius ${fmt(k.r_max_new,2)} of ${fmt(k.r_max_allowed,0)}`).join("; "),st:ko.every(k=>k.ok)?"pass":"fail"};}
  if(c.id==="env")return {txt:ENV_OUT.length?ENV_OUT.map(e=>`radius ${fmt(e.new_r_max,1)} against ${fmt(e.stock_r_max,1)} in the ${e.z_I.join(" to ")} mm band`).join("; "):"inside in every band",st:ENV_OUT.length?"risk":"pass"};
  if(c.id==="press"){const so=OVL.filter(o=>o.theta===undefined),ne=so.filter(o=>o.cls==="error").length;
    return {txt:`${F3.static.length} overlaps, 0.00 mm apart; ${ne} not intended`,st:ne?"fail":"pass"};}
}

/* ---------- findings: every gap, overlap and part that cannot be fitted, worst first ---------- */
const slug=t=>String(t).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
const ASMI=(D.asm&&D.asm.fastener_items)||[];
function nearItem(at,pre){let b=null,bd=8;ASMI.forEach(i=>{if(pre&&!i.id.startsWith(pre))return;const d=Math.hypot(i.centroid[0]-at[0],i.centroid[1]-at[1],i.centroid[2]-at[2]);if(d<bd){bd=d;b=i;}});return b;}
const iname=id=>id.replace(/_(\d+)$/," $1").replace(/_/g," ").replace(/^./,c=>c.toUpperCase());
function overlapPosition(at){const x=at[0]<-0.05?"left":at[0]>0.05?"right":"centre";
  const y=at[1]<-0.05?"rear":at[1]>0.05?"front":"midline",z=at[2]<-0.05?"lower":at[2]>0.05?"upper":"mid-height";return `${x}, ${y}, ${z}`;}
const FNAME={"horn|housing":"Horn rim to housing wall","horn|fasteners":"Horn face to pivot pin A","knuckle_a|knuckle_b":"Gear teeth, knuckle A to knuckle B"};
const SEV={fail:0,risk:1,tight:2,none:3,design:4,pass:5,integration:6};
const CLS={fail:"fail",risk:"risk",tight:"risk",none:"open",design:"pass",pass:"pass",integration:"open"};
const mid3=(p,q)=>[(p[0]+q[0])/2,(p[1]+q[1])/2,(p[2]+q[2])/2];
/* a travel direction in words; frame G has +Y up toward the arm */
function dirWord(d){if(!d)return "in";const a=d.map(Math.abs),i=a.indexOf(Math.max(...a));if(a[i]<0.99)return "along its axis";
  return i===1?(d[1]>0?"straight up (+Y)":"straight down (−Y)"):`along ${d[i]>0?"+":"−"}${"XYZ"[i]}`;}
function makePairFinding(p){const key=p.a+"|"+p.b,d=DET[key]||{theta:p.thmin,d:p.dmin,const:false,section:null};
    /* a contact the design means to have (gear teeth in mesh) is an intentional contact */
    const dg=designedWhy(p),t=dg?Object.assign({},d.tol,{req:null}):(d.tol||{}),req=t.req&&t.req.min,ir=inRange(p);let st="pass",word="clear",why="",gist="";
    if(requirementFor(p)){
      const r=requirementFor(p),margin=p.dmin-r.minimum_clearance_mm,allowance=p.allowance_mm;
      st=requirementStatus(p);
      word=p.status;
      gist=`${fmt(margin,3)} mm margin; ${fmt(allowance,4)} mm sampling allowance`;
      why=`Requirement: at least ${fmt(r.minimum_clearance_mm,2)} mm, ${r.direction_or_feature}; source ${r.source}. Margin ${fmt(margin,3)} mm.`;}
    else if(p.status==="governed elsewhere"){
      const checks=p.governing_checks||[];
      st=requirementStatus(p);word=st==="pass"?"governed elsewhere":st==="risk"?"feature at risk":"feature failed";
      gist=checks.map(c=>`${checkId(c.requirement_id)} ${fmt(c.measured_mm,3)} mm ${c.status}`).join("; ");
      why=`The whole-solid gap is ${fmt(p.dmin,3)} mm. Feature checks: ${checks.map(c=>
        `${checkId(c.requirement_id)} ${c.feature}: ${fmt(c.measured_mm,3)} mm, ${c.status}, margin ${fmt(c.margin_mm,4)} mm`).join("; ")}.`;
    } else {
      st=requirementStatus(p);
      word=p.status;
      why=p.no_requirement_reason||"No governing clearance requirement is recorded for this pair.";
      if(dg)why=dg[0].toUpperCase()+dg.slice(1)+". "+why;
      if(p.dmin===0&&p.thmin<FLOOR)gist=`${ir?fmt(ir.d,2):"–"} mm at the lowest driven angle`;}
    const measured=`${fmt(p.dmin,2)} mm`;
    const value=requirementFor(p)?`${measured}; ${p.requirement_id} at least ${fmt(p.required_mm,2)} mm`:
      p.status==="governed elsewhere"?`${measured} gap; ${gist}`:measured;
    return {id:slug(p.a+"-"+p.b),kind:"gap",title:FNAME[key]||`${pn(p.a)} to ${lc(pn(p.b))}`,st,word,val:value,n:p.dmin,gist,
      when:d.const?"the same at every jaw angle":p.dmin===0?`touching at ${deg(p.thmin)}°`:`smallest at ${deg(d.theta)}°`,
      why,pair:p,det:d,tol:t,req:requirementFor(p),
      margin:requirementFor(p)?p.dmin-requirementFor(p).minimum_clearance_mm:null,
      allowance:FITREQ.sampling.allowance_mm[key],solid:[p.a,p.b],th:d.theta,psi:0};
}

function buildFindings(){
  const L=[],so=OVL.filter(o=>o.theta===undefined),err=so.filter(o=>o.cls==="error");
  err.forEach(o=>{const it=o.b==="fasteners"?(nearItem(o.at,"deck_screw")||nearItem(o.at)):null,nm=it?iname(it.id):pn(o.b);
    L.push({id:"overlap-"+o.id+"-"+slug(nm),kind:"overlap",title:`${nm} at ${overlapPosition(o.at)} overlaps the ${lc(pn(o.a))}`,st:"fail",word:"error",val:fmt(o.v,2)+" mm³",n:-o.v,
      when:"seated; the parts do not move",gist:lc(o.why),why:`The ${nm} (${o.b}) and the ${lc(pn(o.a))} share ${fmt(o.v,2)} mm³${o.size?`, a block ${o.size.map(x=>fmt(x,1)).join(" by ")} mm`:""}, centred at x ${fmt(o.at[0],1)}, y ${fmt(o.at[1],1)}, z ${fmt(o.at[2],1)}. ${o.why[0].toUpperCase()+o.why.slice(1)}.`,
      ov:o,solid:[o.a,"fasteners"],th:0,psi:0});});
  if(so.length)L.push({id:"overlaps-body",kind:"overlaps",title:`${so.length} overlaps in the body, ${err.length} not intended`,/* the error has its own row above, so this summary does not count it a second time */
    st:"design",word:err.length?`${so.length-err.length} by design`:"by design",
    val:String(so.length),n:err.length?-Math.max(...err.map(o=>o.v))+0.01:0,when:"seated; the parts do not move",
    why:`${so.length-err.length} are by design: ${[...new Set(so.filter(o=>o.cls!=="error").map(o=>o.why))].join("; ")}. ${err.length?`Not intended: ${err.map(o=>(o.b==="fasteners"&&nearItem(o.at,"deck_screw")?iname(nearItem(o.at,"deck_screw").id).toLowerCase():lc(pn(o.b)))+", "+fmt(o.v,2)+" mm³").join("; ")}.`:""}`,
    solid:[],th:0,psi:0,err:err[0]});
  const boss=so.find(o=>o.a==="housing"&&o.b==="servo");
  if(boss)L.push({id:"boss-bore-finish",kind:"overlaps",title:"Printed and reamed servo boss bore",st:"design",word:"clearance",
    val:`printed ${fmt(boss.v,2)} mm³; finished ${fmt(boss.finished_v,2)} mm³`,n:0,
    when:"3D model: printed Ø8.8 mm; finished Ø9.0 H7",why:boss.why+
      " The finished overlap is measured after cutting the housing model to the reamed bore.",solid:["housing","servo"],th:0,psi:0});
  BLD.filter(b=>!b.ok).forEach(b=>{
    if(b.id==="dog_screw"){L.push({id:"build-dog-screw",kind:"dog",title:"Dog set screw engagement",st:"fail",word:"below drawn engagement",val:`${fmt(b.engage,1)} mm in the slot`,n:b.engage-b.engage_cad,
      when:`the CAD screw reaches ${fmt(b.engage_cad,1)} mm into the ${fmt(b.slot_depth,1)} mm slot`,why:`The BOM lists ${b.type}: ${fmt(b.screw_len,0)} mm long through the ${fmt(b.horn_t,0)} mm horn leaves ${fmt(b.proud,0)} mm beyond the horn face. The modelled screw ends at z ${fmt(b.pin_z[1],1)}.`,
      gist:"the listed screw engagement is below the CAD geometry",b,solid:["horn","knuckle_a","fasteners_a"],th:0,psi:0});return;}
    const nm=iname(b.id),dv=b.driver,so=b.seated_overlap||0,bl=b.blocker&&lc(pn(b.blocker));
    /* blocked at the start of the checked approach means blocked all the way, not "30 mm short" */
    const whole=b.first_touch_mm!=null&&b.first_touch_mm>=b.path_len-1e-6;
    /* the assembly check names the feature in the way; say it in words with the clash it implies */
    const sm=/diameter ([\d.]+) mm standoff at x (-?[\d.]+), y (-?[\d.]+) reaches x (-?[\d.]+) while the screw head reaches x (-?[\d.]+)/.exec(b.evidence||"");
    const feat=sm?`The ${bl}'s ${fmt(+sm[1],1)} mm standoff beside the seat reaches x ${fmt(+sm[4],2)} and the screw head reaches x ${fmt(+sm[5],2)}, so the head runs into the standoff by ${fmt(Math.abs(+sm[4]-+sm[5]),2)} mm on the way up. `:"";
    L.push({id:"build-"+slug(nm),kind:"build",title:`${nm} cannot be fitted`,st:"fail",word:"cannot be fitted",val:b.first_touch_mm==null?"overlaps seated":whole?"blocked all the way":`hits ${fmt(b.first_touch_mm,1)} mm short`,n:-0.6,
      when:b.blocker?(whole?`pushed ${dirWord(b.dir)} into its insert, it is inside the ${bl} over the whole ${fmt(b.path_len,0)} mm approach checked`:`pushed ${dirWord(b.dir)} into its insert, it hits the ${bl} ${fmt(b.first_touch_mm,1)} mm before it is seated`):"",
      why:`${feat}${b.blocker&&!whole?`The screw cannot travel the last ${fmt(b.first_touch_mm,1)} mm (found in 0.5 mm steps, so the figure under Assembly check notes can differ by one step): the ${bl} is in its path (red in 3D). `:""}${b.blocker&&whole?`The ${bl} is in its path from the start of the approach (red in 3D). `:""}${so>0.01?`Seated, it would still share ${fmt(so,1)} mm³ with the housing. `:""}${dv&&dv.free_mm!=null?`A screwdriver from below has ${fmt(dv.free_mm,1)} mm of clear length against the ${fmt(dv.need_mm,0)} mm it needs.`:""}`,
      ev:b.evidence,b,solid:[b.blocker||"housing"],th:0,psi:0});});
  L.push(...F3.pairs.map(makePairFinding));
  if(DET.roll){const d=DET.roll;
    L.push({id:"roll-wrist",kind:"roll",title:"Wrist plate to the arm's wrist link",st:"none",word:"no requirement",val:fmt(d.d,2)+" mm",n:d.d,
      when:d.const?"the same at every roll angle and both jaw angles":`smallest at ${deg(d.psi)}° roll`,
      why:(d.const?"Turning the wrist does not change this gap. ":"")+"The running-clearance basis is shown below.",
      det:d,tol:d.tol,solid:[d.a],arm:true,th:d.theta,psi:d.psi});}
  const pads=OVL.filter(o=>o.theta!==undefined&&o.cls==="design");
  if(pads.length){const w=pads.reduce((a,b)=>b.v>a.v?b:a);L.push({id:"pads",kind:"padov",title:"Pads overlap in the grip",st:"design",word:"by design",val:fmt(w.v,0)+" mm³",n:9,when:`at ${deg(w.theta)}°, past touch`,
    why:"Below 0° the soft pads press into each other; the overlap is the squeeze, not a clash.",ovs:pads.filter(o=>o.theta===w.theta),solid:[],th:w.theta,psi:0});}
  ENV_OUT.forEach((e,i)=>L.push({id:"envelope"+(i?"-"+i:""),kind:"band",
    title:"Unverified arm clearance",st:"integration",word:"check on arm",
    val:fmt(e.new_r_max,1)+" mm",n:i,
    when:`radius in the ${e.z_I.join(" to ")} mm band from the interface`,why:`The stock gripper reaches ${fmt(e.stock_r_max,1)} mm here, so the arm has not been shown to clear this.`,env:e,solid:null,th:0,psi:0}));
  return L.sort((a,b)=>SEV[a.st]-SEV[b.st]||a.n-b.n);
}
const FF=buildFindings();
/* an anchor per finding at the top of the 3D check, so a deep link resolves before the view is drawn */
{const fig=$("#fit-3d");if(fig){const an=h("div",{class:"fanch","aria-hidden":"true"});FF.forEach(f=>h("span",{id:"fit-f-"+f.id},an));fig.insertBefore(an,$(".fbar",fig));}}

/* ---------- state ---------- */
const FST={th:0,roll:0};
const FS={cur:null,whole:false,cut:{on:false,mode:"f",flip:false,off:0},zoom:1,caps:{},geo:{},plane:null};
const reduceMotion=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
const FCOL={pass:0x1b7443,risk:0xb37400,fail:0xc0392b};
const CAPCOL=[0x2f6fd0,0xd2691e];
const vec=a=>new THREE.Vector3(a[0],a[1],a[2]);

/* ---------- meshes sent by fit3d.py: 16-bit positions on a fine grid, 16- or 32-bit indices ---------- */
function meshGeo(m,key){
  if(key&&FS.geo[key])return FS.geo[key];const T=THREE,q=new Int16Array(b64buf(m.v)),pos=new Float32Array(q.length);
  for(let i=0;i<q.length;i+=3){pos[i]=q[i]*m.s+m.o[0];pos[i+1]=q[i+1]*m.s+m.o[1];pos[i+2]=q[i+2]*m.s+m.o[2];}
  const g=new T.BufferGeometry();g.setAttribute("position",new T.BufferAttribute(pos,3));const ib=b64buf(m.t);
  g.setIndex(new T.BufferAttribute(m.ti===2?new Uint16Array(ib):new Uint32Array(ib),1));g.computeVertexNormals();
  if(m.d){const d=new Uint8Array(b64buf(m.d)),c=new Float32Array(d.length*4),col=new T.Color();
    d.forEach((x,i)=>{const t=x/255,[r,gg,b]=ramp(t);col.setRGB(r,gg,b,T.SRGBColorSpace);c[i*4]=col.r;c[i*4+1]=col.g;c[i*4+2]=col.b;c[i*4+3]=1-0.8*t;});
    g.setAttribute("color",new T.BufferAttribute(c,4));}
  if(key)FS.geo[key]=g;return g;}
/* distance colours: touching is red, the threshold fades out */
const RAMP=[[0,[0.84,0.17,0.12]],[0.4,[0.94,0.54,0.14]],[0.75,[0.96,0.83,0.37]],[1,[0.96,0.83,0.37]]];
function ramp(t){for(let i=1;i<RAMP.length;i++){const [t1,c1]=RAMP[i],[t0,c0]=RAMP[i-1];if(t<=t1){const k=(t-t0)/(t1-t0||1);return c0.map((v,j)=>v+(c1[j]-v)*k);}}return RAMP[RAMP.length-1][1];}
function clipList(){return FS.cut.on&&V3.clip?[V3.clip]:null;}
function nearMesh(m,key){const T=THREE,mat=new T.MeshBasicMaterial({vertexColors:true,transparent:true,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-4,polygonOffsetUnits:-4,side:T.DoubleSide,toneMapped:false});
  mat.clippingPlanes=clipList();const me=new T.Mesh(meshGeo(m,key),mat);me.renderOrder=3;return me;}
function solidMesh(m,key,color,clip){const T=THREE,mat=new T.MeshStandardMaterial({color,roughness:0.5,metalness:0,emissive:color,emissiveIntensity:0.35,side:T.DoubleSide});
  if(clip)mat.clippingPlanes=clipList();const me=new T.Mesh(meshGeo(m,key),mat);me.renderOrder=2;
  /* x-ray: a small body buried inside a part stays visible through whatever is in front of it */
  if(clip==="xray"){mat.clippingPlanes=null;mat.depthTest=false;mat.transparent=true;mat.opacity=0.92;me.renderOrder=4;}return me;}

/* ---------- capped section: the cut face of each solid part is filled, one colour per part ---------- */
function capFor(k){
  if(FS.caps[k])return FS.caps[k];const T=THREE,root=k==="ctx"?V3.ctx:V3.parts[k].node;
  const base={depthWrite:false,depthTest:false,colorWrite:false,stencilWrite:true,stencilFunc:T.AlwaysStencilFunc};
  const mb=new T.MeshBasicMaterial(Object.assign({side:T.BackSide,stencilFail:T.IncrementWrapStencilOp,stencilZFail:T.IncrementWrapStencilOp,stencilZPass:T.IncrementWrapStencilOp},base));
  const mf=new T.MeshBasicMaterial(Object.assign({side:T.FrontSide,stencilFail:T.DecrementWrapStencilOp,stencilZFail:T.DecrementWrapStencilOp,stencilZPass:T.DecrementWrapStencilOp},base));
  mb.clippingPlanes=mf.clippingPlanes=[FS.plane];

  s+="~s="+(FS.cut.on?`${FS.cut.mode},${FS.cut.flip?1:0},${FS.cut.off}`:"off");return s;}
function parseHash(hs){const m=/^#?fit-f-([a-z0-9-]+)(.*)$/.exec(hs||"");if(!m)return null;const o={id:m[1]};
  m[2].split("~").forEach(kv=>{const i=kv.indexOf("="),k=kv.slice(0,i),v=kv.slice(i+1);if(k==="j"&&Number.isFinite(+v))o.th=+v;if(k==="r"&&Number.isFinite(+v))o.psi=+v;
    if(k==="c"){const a=v.split(",").map(Number);if(a.length===6&&a.every(Number.isFinite))o.cam=a;}if(k==="s")o.s=v;});return o;}
function stopSweep(){const b=$("#fitPlay");if(b&&b.getAttribute("aria-pressed")==="true"){b.setAttribute("aria-pressed","false");b.textContent="Sweep the jaw";V3.anim=null;}}
function syncPick(){const f=FS.whole?null:FS.cur,full=f?f.title+(f.title.includes(f.val)?"":": "+f.val):"";$("#fitPick").value=f?f.id:"";$("#fitPick").title=full;$("#fitPickRead").textContent=f?full:"Whole assembly";$("#fitAll").setAttribute("aria-pressed",String(!f));
  $("#fitCount").textContent=f?`Finding ${FF.indexOf(f)+1} of ${FF.length}`:`${FF.length} findings`;
  $$("#fitList li").forEach(li=>li.setAttribute("aria-current",String(!!f&&li.dataset.f===f.id)));}
function selectFinding(id,opt={}){
  const f=FF.find(x=>x.id===id)||FF[0];if(!f)return;FS.cur=f;FS.whole=false;FS.zoom=1;stopSweep();
  FST.th=opt.th!=null?opt.th:f.th||0;FST.roll=opt.psi!=null?opt.psi:f.psi||0;
  V3.fitSolid=f.solid?new Set(f.solid):null;FS.armSolid=!!f.arm;
  FS.cut={on:!!secPlane(f),mode:"f",flip:false,off:0};
  if(opt.s){if(opt.s==="off")FS.cut.on=false;else{const [md,fl,of]=opt.s.split(",");if(/^[xyzf]$/.test(md)){FS.cut={on:true,mode:md,flip:fl==="1",off:Number.isFinite(+of)?+of:0};}}}
  syncPick();renderCard();renderSec();fitSync(false);
  if(V3.ready){if(opt.cam){V3.cam.position.set(opt.cam[0],opt.cam[1],opt.cam[2]);V3.ctl.target.set(opt.cam[3],opt.cam[4],opt.cam[5]);V3.ctl.update();V3.dirty=true;}else frameFinding(f,!opt.instant);}
  if(opt.hash!==false&&(V3.ready||!opt.cam))setHash(linkHash());}
function wholeView(anim=true){FS.whole=true;V3.fitSolid=null;FS.armSolid=true;FS.cut.on=false;stopSweep();syncPick();renderCard();renderSec();fitSync();
  if(V3.ready){const t=vec(HOME_T);flyTo(t.clone().addScaledVector(vec(HOME_DIR).normalize(),HOME_D),t,anim);}setHash("fit-3d");}
function step(d){const i=FS.whole||!FS.cur?(d>0?-1:0):FF.indexOf(FS.cur);selectFinding(FF[(i+d+FF.length)%FF.length].id);}
function toggleCut(){FS.cut.on=!FS.cut.on;if(FS.cut.on&&!secPlane(FS.whole?null:FS.cur)&&FS.cut.mode==="f")FS.cut.mode="z";setCut();drawFit();}

/* ---------- lists ---------- */
const FCHK={body:"horn-housing",cross:"finger-a-knuckle-b",gear:"knuckle-a-knuckle-b",pads:"pads",roll:"roll-wrist",env:"envelope",press:"overlaps-body"};
function renderLists(){
  const groups=[["fail","Fails"],["risk","At risk"],["none","No requirement"],["design","By design"],
    ["pass","Met"],["integration","Unverified arm clearance"]];
  $("#fitPick").innerHTML=groups.map(([k,t])=>{const L=FF.filter(f=>f.st===k);return L.length?`<optgroup label="${t}">${L.map(f=>`<option value="${f.id}">${esc(f.title)}</option>`).join("")}</optgroup>`:"";}).join("");
  $("#fitList").innerHTML=FF.map((f,i)=>{
    const heading=f.st==="integration"&&(i===0||FF[i-1].st!=="integration")?
      '<li class="integration-heading"><h3>Unverified arm clearance</h3></li>':"";
    return heading+`<li data-f="${f.id}" aria-current="false"><button type="button"><span>`+
      `<b>${esc(f.title)}</b><small>${esc(f.when)}</small></span><span class="n">${esc(f.val)}</span>`+
      `${st(CLS[f.st],f.word)}</button></li>`;}).join("");
  $("#fitChecks").innerHTML=FCK.map(c=>{
    const s=checkSummary(c);
    const pairFinding=s.w&&FF.find(f=>f.pair&&f.pair.a===s.w.a&&f.pair.b===s.w.b);
    const lf=pairFinding||FF.find(f=>f.id===FCHK[c.id]);
    const fid=lf&&lf.id,ok=!!lf;
    c.sum=s;
    /* a check with a finding wears that finding's status word, so the list and the card never disagree */
    return `<div class="chk" data-c="${c.id}"${s.w?` data-part="${s.w.a} ${s.w.b}"`:""}>`+
      `<span><b>${esc(c.name)}</b><small>Worst: ${esc(s.txt)}</small></span>`+
      `${lf?st(CLS[lf.st],lf.word):st(s.st,s.st==="risk"?"at risk":s.st==="pass"?"met":"no requirement")}`+
      `${ok?`<button type="button" class="show3d" data-f="${fid}">Show</button>`:""}</div>`;}).join("");
  $("#fitFind tbody").innerHTML=FF.length?FF.map((f,i)=>`<tr data-part="${(f.solid||[]).join(" ")||"housing"}"><td>${esc(f.title)}</td><td class="n">${esc(f.val)}</td><td class="w">${esc(f.when)}${f.why?". "+esc(f.why):""}</td><td>${st(CLS[f.st],f.word)}</td><td><button type="button" class="show3d" data-f="${f.id}">Show in 3D</button></td></tr>`).join("")
    :`<tr><td colspan="5" class="note">No fit findings.</td></tr>`;}
function showIn3D(id){selectFig($("#fit-3d"),false);selectFinding(id);const s=$(".fbar");if(s&&s.getBoundingClientRect().top<0)s.scrollIntoView({block:"start"});}
/* the old checks table and key numbers, kept */
function renderFitTables(){
  const r=[];
  FIT.keepout_params.forEach(k=>r.push([`Keep-out, ${k.z_from_H.join(" to ")} mm from the horn`,`radius ${k.r_max_new} mm, ${k.r_max_allowed} allowed`,k.ok]));
  RING.forEach(x=>r.push([`Roll gap, ${x.z_I.join(" to ")} mm band`,`${fmt(x.radial_gap,2)} mm between radius ${x.gripper_r_max} and the fixed ${x.stationary_r_min}`,x.radial_gap>0]));
  FIT.envelope_vs_stock.forEach(e=>r.push([`Stock envelope, ${e.z_I.join(" to ")} mm band`,`radius ${e.new_r_max} mm, stock ${e.stock_r_max}`,e.inside]));
  FIT.jaw_sweep.forEach(j=>r.push([`Jaw at ${fmt(j.theta_deg,1)}°`,`${Object.keys(j.clash_mm3).length?"clash: "+Object.entries(j.clash_mm3).map(([k,v])=>decode(k)+" "+fmt(v,2)+" mm³").join(", "):"no part clash"}; pad overlap ${fmt(j.pad_interference_mm3,0)} mm³; pad gap ${fmt(j.pad_min_dist_mm,1)} mm`,Object.keys(j.clash_mm3).length===0]));
  if(WF){Object.entries(WF.per_case).forEach(([k,v])=>r.push([`Wrist flex, ${k.startsWith("stock")?"stock gripper":"new gripper, open"}, roll ${k.split("@roll")[1]}°`,v.clash_phi_deg.length?`clash at ${v.clash_phi_deg.join(", ")}°, up to ${fmt(v.max_clash_mm3,1)} mm³`:`clear from ${v.clear_phi_deg.join(" to ")}°`,k.startsWith("stock")||v.clash_phi_deg.every(p=>(WF.per_case[k.replace("new_open","stock")].clash_phi_deg||[]).includes(p))]));}
  r.push(["Mass-moment",`${fmt(MASS.mass_moment_gmm,0)} of ${fmt(MASS.budget_gmm,0)} ${GMM}; ${fmt(MASS.with_wrist_uvc_16g_at_u30_gmm,0)} with a 16 g wrist camera`,MASS.ok]);
  $("#fitTable tbody").innerHTML=r.map(x=>`<tr><td>${esc(x[0])}</td><td>${esc(x[1])}</td><td>${x[2]?st("pass","clear"):st(x[0].startsWith("Stock")?"risk":"fail",x[0].startsWith("Stock")?"outside":"fails")}${x[0]==="Mass-moment"?` <a href="#mass">Mass budget</a>`:""}</td></tr>`).join("");
  const ko=FIT.keepout_params,body=checkSummary(FCK[0]),cross=checkSummary(FCK[1]);
  kv($("#fitNums"),[["Tightest moving gap",body.w?fmt(body.w.dmin,2)+" mm":"–",body.w?`${pn(body.w.a)} to ${pn(body.w.b)}, at every jaw angle`:"",body.st==="pass"?"cell-ok":"cell-warn"],
    ["Side A to side B",cross.w?fmt(cross.w.dmin,2)+" mm":"–",cross.w?`${pn(cross.w.a)} to ${pn(cross.w.b)}, past the floor only`:"",cross.st==="pass"?"cell-ok":"cell-warn"],
    ["Tightest roll gap",RW?fmt(RW.d,2)+" mm":fmt(FIT.roll_min_radial_gap_mm,2)+" mm",`measured in 3D at every roll angle; ${fmt(FIT.roll_min_radial_gap_mm,2)} mm by the ring method`,(RW?RW.d:FIT.roll_min_radial_gap_mm)<1?"cell-warn":"cell-ok"],
    ["Keep-out radii",ko.map(k=>k.r_max_new).join(" and ")+" mm",ko.map(k=>k.r_max_allowed).join(" and ")+" allowed"],
    ["Stock envelope",ENV_OUT.length?"outside in "+ENV_OUT.length+" band":"inside",ENV_OUT.map(e=>`radius ${e.new_r_max} against ${e.stock_r_max} mm`).join("; ")||"",ENV_OUT.length?"cell-warn":"cell-ok"],
    ["Jaw sweep",SWEEP_CLASH.length?"clash":"clear",`${F3.th.length} angles from ${deg(F3.th[0])}° to +${deg(F3.th[F3.th.length-1])}°`,SWEEP_CLASH.length?"cell-bad":"cell-ok"],
    ["Wrist flex",WF?(WF.ok_vs_stock?"no new clash":"new clash"):"not run","against the stock gripper, ±95°",WF&&WF.ok_vs_stock?"cell-ok":"cell-warn"]]);
}

/* ---------- controls ---------- */
function renderFit(){
  renderLists();renderFitTables();
  $("#fitPick").addEventListener("change",e=>selectFinding(e.target.value));
  $("#fitPrev").addEventListener("click",()=>step(-1));$("#fitNext").addEventListener("click",()=>step(1));
  $("#fitAll").addEventListener("click",()=>wholeView());  $("#fitList").addEventListener("click",e=>{const li=e.target.closest("li[data-f]");if(li){selectFinding(li.dataset.f);const s=$(".fbar");if(s)s.scrollIntoView({block:"start",behavior:reduceMotion()?"auto":"smooth"});}});
  $("#fitChecks").addEventListener("click",e=>{const b=e.target.closest(".show3d");if(b)showIn3D(b.dataset.f);});
  $("#fitFind").addEventListener("click",e=>{const b=e.target.closest(".show3d");if(b)showIn3D(b.dataset.f);});
  $("#fitJaw").addEventListener("input",e=>setPose(+e.target.value,null));
  $("#fitRoll").addEventListener("input",e=>setPose(null,+e.target.value));
  $("#fitCutOn").addEventListener("click",toggleCut);
  $$("#fit-3d [data-cut]").forEach(b=>b.addEventListener("click",()=>{FS.cut.mode=b.dataset.cut;FS.cut.on=true;FS.cut.off=0;setCut();drawFit();}));
  $("#fitFlip").addEventListener("click",()=>{FS.cut.flip=!FS.cut.flip;setCut();drawFit();});
  $("#fitCutPos").addEventListener("input",e=>{FS.cut.off=+e.target.value;setCut();drawFit();});
  $$("#fit-3d [data-view]").forEach(b=>b.addEventListener("click",()=>preset(b.dataset.view)));
  $("#fitSec").addEventListener("click",e=>{const b=e.target.closest("[data-z]");if(!b)return;FS.zoom=Math.max(0.25,Math.min(16,FS.zoom*(b.dataset.z==="+"?2:0.5)));renderSec();});
  $("#fitLink").addEventListener("click",async e=>{const url=location.href.split("#")[0]+"#"+linkHash();setHash(linkHash());const b=e.currentTarget;
    try{await navigator.clipboard.writeText(url);b.textContent="Link copied";}catch(err){b.textContent="Link in the address bar";}setTimeout(()=>{b.textContent="Copy link";},1800);});
  $("#fitPlay").addEventListener("click",e=>{const on=e.target.getAttribute("aria-pressed")!=="true";if(!on){stopSweep();return;}
    e.target.setAttribute("aria-pressed","true");e.target.textContent="Stop the sweep";let dir=1,last=0;const stp=reduceMotion()?400:90;
    V3.anim=t=>{if(t-last<stp)return;last=t;let th=FST.th+dir;if(th>20){th=20;dir=-1;}if(th<-11){th=-11;dir=1;}setPose(th,null);};});
  document.addEventListener("keydown",e=>{if(CUR!=="fit"||e.ctrlKey||e.metaKey||e.altKey||$("#fit-3d").hidden)return;if(e.target.closest&&e.target.closest("input,select,textarea,[contenteditable]"))return;
    const k=e.key;if(k==="]")step(1);else if(k==="[")step(-1);else if(k==="f"||k==="F")preset("fit");else if(k==="0")wholeView();
    else if(k.length===1&&"1234".includes(k))preset(["front","side","top","iso"][+k-1]);else if(k==="s"||k==="S")toggleCut();else if((k==="x"||k==="X")&&FS.cut.on){FS.cut.flip=!FS.cut.flip;setCut();drawFit();}else return;e.preventDefault();});
  /* drag the arrow on the cut plane to slide the section along its normal */
  const hookDrag=()=>{if(FS.dragHooked||!V3.cv)return;FS.dragHooked=true;const T=THREE;let drag=null;
    V3.cv.addEventListener("pointerdown",e=>{if(V3.mode!=="fit"||!FS.handle)return;const r=V3.cv.getBoundingClientRect();
      /* only a press that ray-hits the arrow's head mesh slides the section; a press anywhere else falls through to the orbit controls */
      const rc=new T.Raycaster(),ndc=new T.Vector2((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);rc.setFromCamera(ndc,V3.cam);rc.params.Line.threshold=0.6;
      FS.handle.updateMatrixWorld(true);if(!rc.intersectObject(FS.handle.cone,false).length)return;
      e.stopImmediatePropagation();e.preventDefault();V3.ctl.enabled=false;V3.cv.setPointerCapture(e.pointerId);
      const a=FS.cutO.clone().project(V3.cam),b=FS.cutO.clone().add(FS.plane.normal).project(V3.cam),sd=[(b.x-a.x)*r.width/2,-(b.y-a.y)*r.height/2];
      drag={x:e.clientX,y:e.clientY,off:FS.cut.off,sd,l2:Math.max(1e-6,sd[0]*sd[0]+sd[1]*sd[1]),sgn:FS.cut.flip?-1:1};},{capture:true});
    V3.cv.addEventListener("pointermove",e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y,mm=(dx*drag.sd[0]+dy*drag.sd[1])/drag.l2;
      FS.cut.off=Math.max(-40,Math.min(40,Math.round((drag.off+mm*drag.sgn)*10)/10));setCut();drawFit();});
    const end=()=>{if(!drag)return;drag=null;V3.ctl.enabled=true;};V3.cv.addEventListener("pointerup",end);V3.cv.addEventListener("pointercancel",end);
    V3.ctl.addEventListener("end",()=>{if(CUR==="fit"&&FS.cur&&!FS.whole&&/^#fit-f-/.test(location.hash))setHash(linkHash());});};
  (V3.onready=V3.onready||[]).push(hookDrag);if(V3.ready)hookDrag();
  /* the panels do not wait for the model */
  if(!FS.cur&&FF.length){FS.cur=FF[0];syncPick();renderCard();renderSec();renderChart();}
}
/* open on the finding the link names, else on the worst one */
ENTER.fit=()=>{
  const hp=parseHash(location.hash),own=!location.hash||/^#(fit|fit-3d|fit-f-.*)$/.test(location.hash);
  const go=()=>{setMode("fit",$("#fit3d"));
    if(hp&&FF.some(f=>f.id===hp.id))selectFinding(hp.id,{th:hp.th,psi:hp.psi,cam:hp.cam,s:hp.s,instant:true,hash:false});
    else if(FS.whole)wholeView(false);else if(FF.length)selectFinding(FS.cur?FS.cur.id:FF[0].id,{instant:true,hash:own});else drawFit();};
  if(V3.ready)go();else (V3.onready=V3.onready||[]).push(()=>{if(CUR==="fit")go();});attach3D($("#fit3d"));stopSweep();};
window.addEventListener("hashchange",()=>{const hp=parseHash(location.hash);if(!hp)return;
  setTimeout(()=>{if(CUR==="fit"&&FF.some(f=>f.id===hp.id)&&(!FS.cur||FS.whole||FS.cur.id!==hp.id||hp.cam))selectFinding(hp.id,{th:hp.th,psi:hp.psi,cam:hp.cam,s:hp.s,hash:false});},0);});
{const counts=F3.pair_status_counts||{},nf=counts.fail||0,nr=counts["at risk"]||0;
  const nn=counts["no requirement"]||0,nm=counts.met||0,ng=counts["governed elsewhere"]||0;
  const failed=F3.verdict&&F3.verdict.pass===false;
  const atRisk=F3.verdict&&F3.verdict.at_risk&&F3.verdict.at_risk.length?` Feature checks at risk: ${F3.verdict.at_risk.join("; ")}.`:"";
  const reasons=(failed?` Full audit failed: ${F3.verdict.reasons.join("; ")}.`:"")+atRisk;
  VIEWS.fit={st:failed||nf?"fail":nr?"risk":"pass",
    v:`Nominal pairs: ${nf} fail, ${nr} at risk, ${nm} met, `+
      `${ng} governed elsewhere, and ${nn} no requirement pairs.${reasons}`};}
RENDER.fit=renderFit;
</script>
